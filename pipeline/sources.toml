# Download manifest. One entry per dataset; one [[...files]] row per file.
#
# - role:     how the pipeline finds the file (do not rename once used)
# - path:     where it lands, relative to data/raw/
# - url:      left blank until the exact file is confirmed; `download` skips blanks
# - sha256:   pin after the first download so a changed upstream file fails loudly
#
# Adding a dataset or changing a version needs team sign-off (AGENTS.md).
# Nothing under data/raw/ is ever committed.

[sources.lardos]
title = "Lardos et al. (2024) research data"
citation = "Lardos A. et al. (2024). A systematic methodology to assess the identity of plants in historical texts: A case study based on the Byzantine pharmacy text John the Physician's Therapeutics. Journal of Ethnopharmacology 322: 117622. doi:10.1016/j.jep.2023.117622"
version = ""
licence = "Paper CC BY 4.0. Data licence unconfirmed."
licence_confirmed = false
republish = false
notes = "11 data files. The PRD names files 2, 3, 5, 6, 9 and 11 for ingest. Contains text from the Beck translation and two regional floras: treat as copyrighted."

